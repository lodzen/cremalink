[build-system]
requires = ["setuptools>=80.9.0", "setuptools-scm[simple]>=9.2.2"]
build-backend = "setuptools.build_meta"

[project]
name = "cremalink-lodzen"
dynamic = ["version"]
description = "Python library and local API server for monitoring and controlling IoT coffee machines."
authors = [
    { name = "Daniel", email = "dalodzik@googlemail.com"},
    { name = "Midian Tekle Elfu", email = "developer@midian.tekleelfu.de"},
]
maintainers = [{ name = "Daniel", email = "dalodzik@googlemail.com"}]
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "requests>=2.34.0",
    "pycryptodome==3.23.0",
    "aiohttp>=3.13.0",
    "pydantic>=2.12.0",
    "pydantic-settings>=2.13.0",
]
license = "AGPL-3.0-or-later"
license-files = ["LICENSE"]
keywords = ["Local Control", "Cloud Control", "Coffee Machine", "IoT"]
classifiers = [
    "Development Status :: 4 - Beta",

    "Intended Audience :: Developers",
    "Intended Audience :: End Users/Desktop",
    "Intended Audience :: Information Technology",

    "Topic :: Software Development",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: System :: Monitoring",
    "Topic :: System :: Networking :: Monitoring",

    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3.15",

    "Operating System :: OS Independent",
]

[project.optional-dependencies]
dev = [
    "cremalink-lodzen[test]",
    "cremalink-lodzen[docs]",
    "ipykernel>=7.2.0",
    "notebook>=7.5.5",
]
test = [
    "pytest>=9.0.3",
    "pytest-asyncio==1.3.0",
]
docs = [
    "sphinx==9.1.0",
    "sphinxcontrib-websupport==2.0.0",
    "sphinx-rtd-theme==3.1.0",
]

[dependency-groups]
docs = [
    "sphinx==9.1.0",
    "sphinxcontrib-websupport==2.0.0",
    "sphinx-rtd-theme==3.1.0"
]

[tool.setuptools.packages.find]
include = ["cremalink*"]
exclude = ["tests*", "notebooks*"]

[tool.setuptools.package-data]
"cremalink.resources" = ["*.json"]
"cremalink.devices" = ["*.json"]


[project.scripts]
cremalink-server = "cremalink.local_server:main"

[project.urls]
homepage = "https://github.com/lodzen/cremalink"
source = "https://github.com/lodzen/cremalink.git"
issues = "https://github.com/lodzen/cremalink/issues"
download = "https://github.com/lodzen/cremalink/archive/refs/heads/main.zip"
funding = "https://github.com/sponsors/lodzen"
